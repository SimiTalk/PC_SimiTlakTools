<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown小助手</title>
  <link rel="icon" type="image/x-icon" href="imgage/icon.ico" />
  
  <!-- 外部样式库 -->
  <link href="https://cdn.jsdelivr.net/npm/normalize.css@8/normalize.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/neo.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <link rel="stylesheet" href="">
  <!-- 自定义样式 -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header>
    <div style="font-weight: bold; font-size: 18px;">Markdown小助手</div>
    <div class="toolbar">
      <button id="header-preview-btn" onclick="toggleWideMode()">👁 预览模式</button>
      <button id="btn-export-word" onclick="exportWord()">📄 导出 Word</button>
    </div>
  </header>

  <div class="main-area">
    <div class="editor-pane">
      <div class="editor-toolbar">
        <button onclick="clearEditor()" title="清空编辑器">🧹 橡皮擦</button>
      </div>
      <textarea id="code"></textarea>
    </div>
    <div class="preview-pane">
      <div class="preview-content markdown-body" id="preview"></div>
    </div>
  </div>

  <button id="exit-wide-btn" class="primary" onclick="toggleWideMode()">退出预览</button>

  <!-- 外部脚本库 -->
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
  <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <!-- 自定义脚本 -->
  <script src="js/app.js"></script>

</body>

</html>
